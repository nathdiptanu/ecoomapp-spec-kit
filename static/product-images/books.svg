<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Books</title>
  <desc id="desc">Illustration of stacked books</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="500" cy="90" r="105" fill="#fed7aa" opacity=".22"/>
  <circle cx="110" cy="320" r="115" fill="#fdba74" opacity=".18"/>
  <rect x="170" y="105" width="92" height="245" rx="10" fill="#fef3c7"/>
  <rect x="275" y="82" width="92" height="268" rx="10" fill="#fb923c"/>
  <rect x="380" y="128" width="92" height="222" rx="10" fill="#fcd34d"/>
  <line x1="202" y1="150" x2="232" y2="150" stroke="#92400e" stroke-width="8"/>
  <line x1="307" y1="135" x2="337" y2="135" stroke="#7c2d12" stroke-width="8"/>
  <line x1="410" y1="172" x2="442" y2="172" stroke="#92400e" stroke-width="8"/>
  <text x="42" y="64" fill="#fffbeb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Books</text>
